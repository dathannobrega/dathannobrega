<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0b1420"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00ff9c" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .hex { fill:#00ff9c; font-size:13px; opacity:0.16; }
    .c1 { animation: fall 9s linear infinite; }
    .c2 { animation: fall 12s linear infinite -4s; }
    .c3 { animation: fall 10s linear infinite -7s; }
    @keyframes fall { from { transform: translateY(-320px); } to { transform: translateY(320px); } }
    .scan { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateY(-80px); } 100% { transform: translateY(340px); } }
    .glitch-a { animation: ga 4s steps(1) infinite; }
    .glitch-b { animation: gb 4s steps(1) infinite; }
    @keyframes ga { 0%,88%,100% { transform: translate(0,0); opacity:0; } 90% { transform: translate(-4px,1px); opacity:.8; } 93% { transform: translate(3px,-2px); opacity:.8; } 96% { opacity:0; } }
    @keyframes gb { 0%,88%,100% { transform: translate(0,0); opacity:0; } 90% { transform: translate(4px,-1px); opacity:.8; } 93% { transform: translate(-3px,2px); opacity:.8; } 96% { opacity:0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1058px 160px; }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    .ring { animation: spin 18s linear infinite; transform-origin: 1058px 160px; }
    .ring2 { animation: spin 26s linear infinite reverse; transform-origin: 1058px 160px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .radar { animation: spin 4s linear infinite; transform-origin: 1058px 160px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="380" cy="160" rx="520" ry="200" fill="url(#glow)"/>

    <!-- hex rain -->
    <g class="mono hex">
      <g class="c1">
        <text x="40" y="40">4D 5A 90 00</text><text x="40" y="120">0x7ffe</text><text x="40" y="200">E8 00 00 00</text><text x="40" y="280">ret</text>
        <text x="700" y="60">SHA256</text><text x="700" y="140">0xdeadbeef</text><text x="700" y="220">FF D0</text><text x="700" y="300">jmp rax</text>
      </g>
      <g class="c2">
        <text x="560" y="30">T1059.001</text><text x="560" y="110">48 8B 05</text><text x="560" y="190">rule 100200</text><text x="560" y="270">0x00401000</text>
        <text x="900" y="80">MITRE</text><text x="900" y="160">C2 beacon</text><text x="900" y="240">90 90 90</text>
      </g>
      <g class="c3">
        <text x="820" y="20">IOC</text><text x="820" y="100">T1003</text><text x="820" y="180">sigma</text><text x="820" y="260">YARA</text>
        <text x="480" y="50">0x4c</text><text x="480" y="130">TLP:CLEAR</text><text x="480" y="210">STIX 2.1</text>
      </g>
    </g>

    <!-- radar / shield -->
    <g>
      <circle cx="1058" cy="160" r="98" fill="none" stroke="#00ff9c" stroke-opacity="0.12"/>
      <circle cx="1058" cy="160" r="66" fill="none" stroke="#00ff9c" stroke-opacity="0.12"/>
      <circle cx="1058" cy="160" r="34" fill="none" stroke="#00ff9c" stroke-opacity="0.12"/>
      <g class="ring"><circle cx="1058" cy="160" r="112" fill="none" stroke="#00e5ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 14"/></g>
      <g class="ring2"><circle cx="1058" cy="160" r="82" fill="none" stroke="#7c5cff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="40 20 4 20"/></g>
      <g class="radar">
        <path d="M1058 160 L1058 62 A98 98 0 0 1 1127 91 Z" fill="#00ff9c" fill-opacity="0.13"/>
        <line x1="1058" y1="160" x2="1058" y2="62" stroke="#00ff9c" stroke-opacity="0.8" stroke-width="1.5"/>
      </g>
      <circle cx="1100" cy="118" r="4" fill="#ff3b6b" class="pulse"/>
      <circle cx="1012" cy="196" r="3" fill="#00ff9c" class="pulse"/>
      <!-- shield -->
      <path class="pulse" d="M1058 130 l24 9 v17 c0 16 -11 28 -24 33 c-13 -5 -24 -17 -24 -33 v-17 z" fill="#0b1420" stroke="#00ff9c" stroke-width="2"/>
      <path d="M1048 158 l7 7 l13 -14" fill="none" stroke="#00ff9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- text -->
    <g class="mono">
      <text x="64" y="92" font-size="15" fill="#00ff9c" opacity="0.85">root@segark:~# ./whoami --profile</text>

      <g font-size="68" font-weight="800" letter-spacing="2">
        <text x="64" y="172" fill="#ff3b6b" class="glitch-a">DATHAN NÓBREGA</text>
        <text x="64" y="172" fill="#00e5ff" class="glitch-b">DATHAN NÓBREGA</text>
        <text x="64" y="172" fill="url(#title)">DATHAN NÓBREGA</text>
      </g>

      <text x="66" y="214" font-size="20" fill="#c9d1d9">
        <tspan fill="#00ff9c">Cybersecurity Analyst</tspan> · <tspan fill="#00e5ff">Detection Engineer</tspan> · <tspan fill="#7c5cff">Incident Response</tspan> · <tspan fill="#ff3b6b">CTI</tspan>
      </text>
      <text x="66" y="256" font-size="15" fill="#8b949e">&gt; hunting weird stuff in logs &amp; building tools so I don't have to<tspan fill="#00ff9c" class="blink">█</tspan></text>
    </g>

    <!-- HUD corners -->
    <g stroke="#00ff9c" stroke-width="2" fill="none" opacity="0.7">
      <path d="M18 46V18H46"/><path d="M1154 18H1182V46"/><path d="M18 274V302H46"/><path d="M1154 302H1182V274"/>
    </g>
    <text x="1182" y="296" class="mono" font-size="11" fill="#00ff9c" opacity="0.5" text-anchor="end">BLUE TEAM · STATUS: ONLINE · COFFEE: CRITICAL</text>

    <rect class="scan" x="0" y="0" width="1200" height="60" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#00ff9c" stroke-opacity="0.25"/>
</svg>
